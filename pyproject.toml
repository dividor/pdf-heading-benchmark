[project]
name = "pdf-heading-benchmark"
version = "0.1.0"
description = "Reproducible PDF heading and hierarchy pilot on WFP evaluation reports"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "scipy>=1.14", "requests>=2.34.2", "beautifulsoup4>=4.12", "pymupdf>=2.1", "pdfplumber>=0.11", "markdown-it-py>=4.0"]

[project.scripts]
pdf-headings = "pdf_heading_benchmark.cli:main"

[project.optional-dependencies]
training = [
    "scikit-learn>=1.7,<2",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff==0.17.5", "pre-commit>=4.0", "mypy>=1.15", "types-requests>=2.32", "bandit>=1.8", "lizard>=1.17", "radon>=6.0", "cognitive-complexity>=1.3", "detect-secrets==1.5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_heading_benchmark"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF", "BLE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
