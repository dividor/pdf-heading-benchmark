<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430">
<rect width="1100" height="430" fill="#f1f6fa"/><g font-family="Arial,sans-serif" fill="#17354a">
<text x="35" y="45" font-size="26" font-weight="bold">Teach a small local model to read document structure</text>
<g fill="white" stroke="#96b0c1" stroke-width="2"><rect x="35" y="85" width="225" height="125" rx="12"/><rect x="305" y="85" width="225" height="125" rx="12"/><rect x="575" y="85" width="225" height="125" rx="12"/><rect x="845" y="85" width="225" height="125" rx="12"/></g>
<g font-size="18"><text x="55" y="120">1. Review source PDFs</text><text x="55" y="153">Heading groups + levels</text><text x="55" y="181">887 training groups</text><text x="325" y="120">2. Learn line grouping</text><text x="325" y="153">Join wrapped titles</text><text x="325" y="181">Across PDF blocks</text><text x="595" y="120">3. Learn heading levels</text><text x="595" y="153">Layout + style + TOC</text><text x="595" y="181">Sequence relationships</text><text x="865" y="120">4. Run locally on CPU</text><text x="865" y="153">Text + heading outline</text><text x="865" y="181">No inference API</text></g>
<g font-size="35" fill="#007c83"><text x="270" y="158">→</text><text x="540" y="158">→</text><text x="810" y="158">→</text></g>
<rect x="35" y="250" width="1035" height="140" rx="12" fill="#e0f0ec"/><text x="55" y="285" font-size="22" font-weight="bold">Evaluate on separate reports</text><text x="55" y="319" font-size="18">Select using 4 validation reports. Then score 32 fully reviewed pages from 4 fresh WFP reports.</text><text x="55" y="350" font-size="18">Exact heading + level F1: 71.6% → 85.7%. Still 8 false headings and 2 wrong levels.</text><text x="55" y="376" font-size="15">Assistant labels are reviewable judgments. Unreviewed text stays unlabelled. This is a small pilot, not universal accuracy.</text>
</g></svg>
